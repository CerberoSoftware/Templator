# Base44 development compose — runs the app from bind-mounted source with live reload.
# Vite dev server (port 3000) is the public entry point; it proxies /api and /uploads
# to the PHP backend service. SQLite database file is stored in a named volume.
services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - VITE_BASE=/
      - VITE_PROXY_TARGET=http://php:80
      - VITE_WATCH_POLLING=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000 --strictPort"
    ports:
      - "3000:3000"
    depends_on:
      php:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    working_dir: /app
    volumes:
      - ./:/app
      - db-data:/app/data
    environment:
      ET_DB_PATH: /app/data/database.sqlite
    command: ["php", "-S", "0.0.0.0:80", "index.php"]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(strpos((string)@file_get_contents(\"http://127.0.0.1:80/api/health\"), \"ok\") !== false ? 0 : 1);'"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    working_dir: /app
    volumes:
      - ./:/app
      - db-data:/app/data
    environment:
      ET_DB_PATH: /app/data/database.sqlite
    command: ["php", "scripts/migrate.php"]

volumes:
  db-data:
